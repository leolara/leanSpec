[pytest]
# Configuration for the pyspec-vectors command.
# The plugin is loaded explicitly here rather than as a global entry point, so
# the default unit-test run never touches it.

addopts =
    -p pyspec_vectors_testing.plugin
    --tb=short

# The vector cases are non-Python files collected by the plugin.
python_files = test_*.py
console_output_style = classic
